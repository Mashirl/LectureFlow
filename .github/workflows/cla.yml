#
# CLA check (SPEC-v3 V7, CONTRIBUTING.md). Uses CLA Assistant Lite, pinned to
# the commit of release v2.6.1.
#
# Signature storage: signatures/version1/cla.json on the branch
# "cla-signatures" of this repository, committed by the action with
# GITHUB_TOKEN. Create that branch once (e.g. an orphan branch) before the
# first external pull request, and keep it writable by GitHub Actions; the
# main branch history is never touched. No personal access token is needed
# because the signatures stay in this repository.
#
# pull_request_target runs in the context of the base repository; this job
# never checks out or runs the pull request's code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the LectureFlow CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant Lite
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the LectureFlow CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before it can be merged, please read the
            LectureFlow Contributor License Agreement (CLA.md) and sign it by replying
            to this pull request with the sentence below. / 感谢你的贡献。合并之前，请阅读
            CLA.md 中的贡献者许可协议，并在本 PR 中回复下面这句话完成签署。
          custom-allsigned-prcomment: All contributors have signed the LectureFlow CLA. / 所有贡献者均已签署 CLA。
          lock-pullrequest-aftermerge: true
