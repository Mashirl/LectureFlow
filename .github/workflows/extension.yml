#
# Browser extension (SPEC-ext M3; CONTRIBUTING-profiles.md). On every branch
# push and pull request, so that a required check never waits for a path
# filter (not on tag pushes and not on cla-signatures, as in ci.yml; a newer
# push to a pull request cancels the older run):
#
#   1. platform profiles and fixtures (scripts/profilecheck): the profile
#      JSON Schema with readable errors per file, the layout, and a
#      redaction scan of the fixtures (cookies, e-mail addresses, tokens,
#      unredacted ids); a step summary lists every finding;
#   2. npm test: the extension's unit tests, including the fixture replay
#      (generic detection re-run on every report, track names checked
#      against the profile);
#   3. the Chrome and Firefox builds and their store packages, uploaded as
#      an artifact, with the third-party NOTICE and licence texts checked
#      in both builds (the licence audit itself is license.yml);
#   4. addons-linter on the Firefox build (web-ext lint, what AMO runs on
#      upload): an error fails the job, a warning does not. The known
#      warnings: data_collection_permissions is newer than Firefox for
#      Android 140 (the extension is desktop only), and Chrome-only APIs
#      used behind a feature check (dom.openOrClosedShadowRoot,
#      cookies.getPartitionKey);
#   5. the end-to-end tests in Playwright's own headless Chromium.
#
# Node is pinned (the version of the other jobs), npm packages by
# extension/package-lock.json (npm ci), Playwright's browser by that
# package's version; every action is pinned to a commit. The job only reads
# the repository: a pull request from a fork runs it the same way, without
# secrets.
name: Extension

on:
  push:
    branches: ["**", "!cla-signatures"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Where the end-to-end test looks for the browser (its default too).
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tools/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      # Standard library only: runs before npm ci, so a contributor sees
      # what is wrong with a profile or fixture first.
      - name: Platform profiles and fixtures (schema, layout, redaction)
        run: node scripts/profilecheck/check.mjs
      - name: Tests of the profile check
        if: ${{ !cancelled() }}
        run: node --test "scripts/profilecheck/*.test.mjs"

      - name: Install (npm ci)
        id: install
        if: ${{ !cancelled() }}
        working-directory: extension
        run: npm ci
      - name: Unit tests and fixture replay
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: extension
        run: npm test

      - name: Build Chrome and Firefox, with their store packages
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: extension
        run: npm run package
      - name: Third-party notices travel with both builds
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: extension
        run: |
          set -eu
          for target in chrome firefox; do
            for f in NOTICE LICENSE.webextension-polyfill browser-polyfill.js tabler/LICENSE; do
              cmp "src/vendor/$f" "dist/$target/vendor/$f"
            done
            cmp profiles/LICENSE "dist/$target/profiles/LICENSE"
            grep -q "MIT License" "dist/$target/ui/icons.js"
          done
          ls -l dist/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: extension-packages
          path: extension/dist/*.zip
          if-no-files-found: error
          retention-days: 14

      # web-ext exits 1 when the linter reports an error and 0 when it
      # reports warnings only (--warnings-as-errors stays off, spelled out;
      # --no-config-discovery: no config file can turn it on).
      - name: Firefox lint (web-ext lint; errors fail, warnings do not)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: extension
        run: npm run lint:firefox

      - name: Install Playwright's Chromium
        id: browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: extension
        run: npx --no-install playwright install --with-deps chromium
      - name: End-to-end tests (headless Chromium, local test site only)
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        working-directory: extension
        run: npm run test:e2e
