#
# Continuous integration (SPEC-v3 V10): on every branch push and pull
# request, on Windows x64 and macOS arm64, in parallel jobs: Go vet and
# tests, the Python worker tests, the desktop shell's unit tests. The licence
# audit is license.yml. Every action is pinned to a commit.
#
# Not on tag pushes: a version tag is pushed only after the CI of its main
# commit has passed, so a run on the tag tested the same commit again (and
# took macOS runners from release.yml). The cla-signatures branch holds only
# the CLA signatures. A newer push to a pull request cancels the run of the
# older one; branch pushes and manual runs are never cancelled.
#
# Python: the worker tests run against worker/requirements.txt (CPU wheels
# of faster-whisper, pypdf, pytest). A smaller set (pytest, numpy, pypdf)
# is not enough: the checkpoint tests import faster_whisper's own speech
# timestamp helper. No model is downloaded; tests that need a GPU, OpenVINO
# or MLX models are marked and skipped (worker/conftest.py).
#
# ffmpeg for Windows is built from pinned sources on Linux
# (desktop/scripts/build-ffmpeg-windows.sh, cached by the hash of the script
# and of desktop/packaging/third-party.json); the Windows tests run the Go
# tests that need a real ffmpeg against that build.
#
# aria2c for macOS (the browser extension's download tool; aria2 publishes
# no macOS binary) is built from its pinned source on macos-14
# (packaging/aria2c/build-aria2c-macos.sh), cached by the hash of the script
# and of desktop/packaging/third-party.json; release.yml reads the same cache.
# ffmpeg for macOS likewise (desktop/scripts/build-ffmpeg-macos.sh).
name: CI

on:
  push:
    branches: ["**", "!cla-signatures"]
  pull_request:
  # Run it by hand from the Actions tab when a push did not start it.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# timeout-minutes: several times the longest run seen (a cache miss that
# builds from source), so that only a hung step reaches it instead of the
# default six hours.
jobs:
  ffmpeg-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: desktop/.cache/ffmpeg-windows-*
          key: ffmpeg-windows-${{ hashFiles('desktop/scripts/build-ffmpeg-windows.sh', 'desktop/packaging/third-party.json') }}
      - name: Build the LGPL ffmpeg for Windows (mingw-w64)
        if: steps.cache.outputs.cache-hit != 'true'
        # The build runs as root: drop its work and download directories,
        # which the ffmpeg-windows-* patterns below would also match, and
        # hand the output to the runner user for the cache and the upload.
        run: |
          sudo bash desktop/scripts/build-ffmpeg-windows.sh --install-deps
          sudo rm -rf desktop/.cache/ffmpeg-windows-work desktop/.cache/ffmpeg-windows-downloads
          sudo chown -R "$(id -u):$(id -g)" desktop/.cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-windows
          path: desktop/.cache/ffmpeg-windows-*/
          if-no-files-found: error
          # The build is under desktop/.cache, which upload-artifact skips
          # as a hidden directory unless told otherwise.
          include-hidden-files: true

  # Builds (or finds in the cache) the macOS aria2c, so a broken build script
  # shows up on push rather than at release time. The script checks the
  # result itself: AppleTLS, only system libraries (otool -L), the minimum
  # macOS version, aria2c --version.
  aria2c-macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: desktop/.cache/aria2c-macos-*
          key: aria2c-macos-${{ hashFiles('packaging/aria2c/build-aria2c-macos.sh', 'desktop/packaging/third-party.json') }}
      - name: Build aria2c for macOS (AppleTLS, from the pinned source)
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash packaging/aria2c/build-aria2c-macos.sh
      - name: Show the build
        run: cat desktop/.cache/aria2c-macos-*/BUILDINFO.txt

  # The same for the macOS ffmpeg (LGPL, dav1d inside). The script checks
  # the configure line and config.h (LGPL 2.1), that only system libraries
  # are linked, the minimum macOS of ffmpeg, ffprobe and libdav1d.a
  # (third-party.json macos), arm64 and the libdav1d decoder.
  ffmpeg-macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: desktop/.cache/ffmpeg-macos-*
          key: ffmpeg-macos-${{ hashFiles('desktop/scripts/build-ffmpeg-macos.sh', 'desktop/packaging/third-party.json') }}
      - name: Build ffmpeg for macOS (LGPL, from the pinned sources)
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash desktop/scripts/build-ffmpeg-macos.sh
      - name: Show the build
        run: cat desktop/.cache/ffmpeg-macos-*/BUILDINFO.txt

  go:
    needs: ffmpeg-windows
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Windows: real-time scanning slows every file the tests write (temp
      # directories, SQLite, atomic replaces), and the default temp
      # directory is on the slower system drive.
      - name: Speed up the Windows runner
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: runner.os == 'Windows'
        with:
          name: ffmpeg-windows
          path: desktop/.cache/
      - name: Use the LGPL ffmpeg build
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bin=$(ls -d "$PWD"/desktop/.cache/ffmpeg-windows-*/bin)
          cygpath -w "$bin" >> "$GITHUB_PATH"

      - name: Go vet
        run: go vet ./...
      # The same packages as `go test -p 4 ./...`, each once, with the same
      # flags; only the order changes. Each package runs its tests one after
      # another, and go test starts packages in the order given, so the
      # longest ones go first instead of starting last (alphabetical order
      # left internal/stages and internal/sched as the tail). A name in the
      # list that no longer exists is left out; new packages run after it.
      - name: Go tests
        shell: pwsh
        run: |
          $all = @(go list ./...)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $slow = 'internal/stages', 'internal/sched', 'cmd/lectureflow', 'internal/api', 'internal/state',
            'internal/agent', 'internal/fetch', 'internal/api/mockserve', 'internal/colab', 'internal/components',
            'internal/sshremote'
          $first = @($slow | ForEach-Object { "lectureflow/$_" } | Where-Object { $all -contains $_ })
          $pkgs = $first + @($all | Where-Object { $first -notcontains $_ })
          if ($pkgs.Count -ne $all.Count -or @($pkgs | Sort-Object -Unique).Count -ne $all.Count) {
            throw "package order: $($pkgs.Count) packages, go list has $($all.Count)"
          }
          go test -p 4 @pkgs
          exit $LASTEXITCODE
      - name: Go build for macOS arm64
        if: runner.os == 'macOS'
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -trimpath -o lectureflow ./cmd/lectureflow

  # The Python and desktop tests need no ffmpeg: they start at once and run
  # beside the Go tests.
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Speed up the Windows runner
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Python dependencies
        run: python -m pip install -r worker/requirements.txt
      - name: Python worker tests
        run: python -m pytest -q worker

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Speed up the Windows runner
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Desktop dependencies
        working-directory: desktop
        # electron 44 downloads its binary at the first require('electron'),
        # not at install: node --test runs the test files in parallel and
        # several of them would download it at once (seen on a Mac: EEXIST,
        # one test file failed). Fetch it once here.
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Desktop unit tests
        working-directory: desktop
        run: npm test
