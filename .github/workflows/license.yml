#
# License audit (SPEC-v3 V7, V10): dependency licenses must be compatible
# with AGPL-3.0, every tracked source file needs its SPDX header. Offline
# apart from downloading the Go modules. THIRD_PARTY_NOTICES.md is
# regenerated by the release build (make.ps1 audit), not here.
name: License audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Download Go modules
        run: go mod download
      - name: Dependency license audit
        run: go run ./scripts/licaudit -check -only deps
      - name: SPDX headers
        if: ${{ !cancelled() }}
        run: go run ./scripts/licaudit -check -only spdx
