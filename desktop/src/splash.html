<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>LectureFlow</title>
<style>
  /* Colours follow the web app's tokens (web/style.css). */
  :root {
    --bg: #eef0f4; --card: #ffffff; --sunken: #f1f3f6;
    --text-1: #161a21; --text-2: #4b5261; --text-3: #7d8492;
    --accent: #1f6feb; --accent-hover: #1a5fd0; --accent-fg: #ffffff;
    --border: rgb(17 24 39 / 0.12); --hover: rgb(17 24 39 / 0.045);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1013; --card: #1b1e23; --sunken: #121418;
      --text-1: #e8eaee; --text-2: #a8afba; --text-3: #737b88;
      --accent: #3b8cff; --accent-hover: #5aa0ff; --accent-fg: #061630;
      --border: rgb(255 255 255 / 0.1); --hover: rgb(255 255 255 / 0.055);
    }
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text-1);
    font: 14px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    display: grid; place-items: center; -webkit-user-select: none; user-select: none; cursor: default;
  }
  .wrap { width: min(520px, calc(100vw - 48px)); display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); display: flex; align-items: center; justify-content: center; gap: 4px; }
  .mark i { display: block; width: 4px; border-radius: 2px; background: #ffffff; transform-origin: center; }
  .mark i:nth-child(1) { height: 11px; }
  .mark i:nth-child(2) { height: 20px; }
  .mark i:nth-child(3) { height: 15px; }
  .mark i:nth-child(4) { height: 8px; }
  body:not([data-state="error"]) .mark i { animation: level 1.4s ease-in-out infinite; }
  .mark i:nth-child(2) { animation-delay: -0.35s !important; }
  .mark i:nth-child(3) { animation-delay: -0.7s !important; }
  .mark i:nth-child(4) { animation-delay: -1.05s !important; }
  @keyframes level { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.55); } }
  @media (prefers-reduced-motion: reduce) { .mark i { animation: none !important; } }
  .name { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .status { color: var(--text-2); min-height: 1.55em; }
  .error { display: none; width: 100%; box-sizing: border-box; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; margin-top: 8px; }
  body[data-state="error"] .error { display: block; }
  body[data-state="error"] .status { display: none; }
  .error h1 { font-size: 16px; font-weight: 600; margin: 0 0 6px; }
  .error p { margin: 0 0 14px; color: var(--text-2); }
  .detail-label { font-size: 12px; color: var(--text-3); margin: 0 0 4px; }
  pre.detail {
    margin: 0 0 16px; padding: 10px 12px; background: var(--sunken); border-radius: 8px; color: var(--text-1);
    font: 12.5px/1.5 "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, "SF Mono", Menlo, monospace;
    white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: auto; -webkit-user-select: text; user-select: text; cursor: text;
  }
  .actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
  .actions .spacer { flex: 1; }
  button[hidden] { display: none; }
  button {
    font: inherit; padding: 6px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text-1);
  }
  button:hover { background: var(--hover); }
  button.primary { background: var(--accent); border-color: transparent; color: var(--accent-fg); }
  button.primary:hover { background: var(--accent-hover); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.6; }
</style>
</head>
<body data-state="starting">
<main class="wrap">
  <div class="brand">
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="name">LectureFlow</div>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <section class="error" id="error" aria-labelledby="title">
    <h1 id="title"></h1>
    <p id="body"></p>
    <div id="detail-wrap">
      <p class="detail-label" id="detail-label"></p>
      <pre class="detail" id="detail"></pre>
    </div>
    <div class="actions">
      <button type="button" id="restore" hidden></button>
      <span class="spacer"></span>
      <button type="button" id="logs"></button>
      <button type="button" id="retry" class="primary"></button>
    </div>
  </section>
</main>
<script src="splash.js"></script>
</body>
</html>
