<html lang="en">
<head><meta charset="utf-8"><title>HLS</title></head>
<body>
  <h1>HLS (test page)</h1>
  <video id="v" muted></video>
  <script>
    // Stands in for an MSE player: requests the master, one variant and a
    // segment the way hls.js would, then shows a blob: source.
    (async () => {
      await (await fetch('/hls/master.m3u8')).text();
      await (await fetch('/hls/v720/index.m3u8')).text();
      await (await fetch('/hls/v720/seg0.ts')).arrayBuffer();
      const ms = new MediaSource();
      document.getElementById('v').src = URL.createObjectURL(ms);
      document.title = 'hls-ready';
    })();
  </script>
</body>
</html>
