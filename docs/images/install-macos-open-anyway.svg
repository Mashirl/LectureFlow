<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="-apple-system, PingFang SC, Helvetica, sans-serif">
  <!-- Schematic, not a screenshot: System Settings > Privacy & Security > "Open Anyway" for an app that is not notarized. -->
  <rect width="720" height="320" fill="#eef0f4"/>
  <g transform="translate(20,20)">
    <rect width="680" height="280" rx="10" fill="#fff" stroke="#c9ced6"/>
    <rect width="180" height="280" rx="10" fill="#f1f3f6"/>
    <text x="20" y="40" font-size="13" fill="#4b5261">系统设置 / System Settings</text>
    <rect x="12" y="150" width="156" height="26" rx="6" fill="#1f6feb"/>
    <text x="22" y="168" font-size="13" fill="#fff">隐私与安全性</text>
    <circle cx="182" cy="163" r="12" fill="#ffd166"/><text x="178" y="168" font-size="13" font-weight="700">1</text>
    <text x="210" y="45" font-size="18" font-weight="600" fill="#161a21">隐私与安全性 · Privacy &amp; Security</text>
    <text x="210" y="80" font-size="13" fill="#4b5261">安全性 / Security（向下滚动）</text>
    <rect x="210" y="100" width="450" height="110" rx="8" fill="#f6f7f9" stroke="#dfe3e8"/>
    <text x="226" y="128" font-size="13" fill="#161a21">已阻止使用“LectureFlow”，因为来自身份不明的开发者。</text>
    <text x="226" y="148" font-size="12" fill="#7d8492">"LectureFlow" was blocked to protect your Mac.</text>
    <rect x="530" y="166" width="114" height="30" rx="6" fill="#fff" stroke="#ffd166" stroke-width="3"/>
    <text x="548" y="186" font-size="13" fill="#161a21">仍要打开</text>
    <circle cx="660" cy="181" r="12" fill="#ffd166"/><text x="656" y="186" font-size="13" font-weight="700">2</text>
    <text x="210" y="245" font-size="12" fill="#4b5261">随后输入登录密码，再在弹出的对话框中点“打开”。③</text>
  </g>
</svg>
